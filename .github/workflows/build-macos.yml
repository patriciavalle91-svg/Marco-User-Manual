name: Build and publish Mac app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare video folder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p video
          gh release download video-source \
            --pattern marco-message.mp4 \
            --dir video

      - name: Build the Mac app
        run: |
          set -euo pipefail

          mkdir -p build
          swiftc -O -target arm64-apple-macos13.0 \
            -framework Cocoa -framework WebKit \
            macos/MarcoLauncher.swift -o build/MarcoLauncher-arm64

          swiftc -O -target x86_64-apple-macos13.0 \
            -framework Cocoa -framework WebKit \
            macos/MarcoLauncher.swift -o build/MarcoLauncher-x86_64

          APP="Marco User Manual.app"
          CONTENTS="$APP/Contents"
          RES="$CONTENTS/Resources"

          mkdir -p "$CONTENTS/MacOS" "$RES"
          cp index.html "$RES/index.html"
          cp -R assets "$RES/assets"
          cp -R video "$RES/video"

          lipo -create \
            build/MarcoLauncher-arm64 \
            build/MarcoLauncher-x86_64 \
            -output "$CONTENTS/MacOS/MarcoLauncher"
          chmod 755 "$CONTENTS/MacOS/MarcoLauncher"

          cat > "$CONTENTS/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Marco User Manual</string>
            <key>CFBundleDisplayName</key><string>Relationship v1.0</string>
            <key>CFBundleIdentifier</key><string>com.gift.marco-usermanual</string>
            <key>CFBundleVersion</key><string>1.0</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleExecutable</key><string>MarcoLauncher</string>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict></plist>
          PLIST

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" Marco-User-Manual-macOS.zip

      - name: Publish downloadable app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Marco-User-Manual-macOS.zip \
            --title "Relationship v1.0 — ${TAG}" \
            --notes "Download and extract the ZIP, then move Marco User Manual.app to Applications. On first launch, macOS may ask you to allow it in System Settings → Privacy & Security."
