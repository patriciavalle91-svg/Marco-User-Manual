name: Build and publish Mac app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app
        run: |
          mkdir -p build/MarcoManual.app/Contents/MacOS
          mkdir -p build/MarcoManual.app/Contents/Resources/video
          cp -R assets build/MarcoManual.app/Contents/Resources/
          cp -R video build/MarcoManual.app/Contents/Resources/ || true
          cp index.html build/MarcoManual.app/Contents/Resources/
          swiftc macos/MarcoLauncher.swift -o build/MarcoManual.app/Contents/MacOS/MarcoManual \
            -framework AppKit -framework WebKit

      - name: Download video release asset if available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view video-source >/dev/null 2>&1; then
            gh release download video-source --pattern marco-message.mp4 --dir build/MarcoManual.app/Contents/Resources/video
          else
            echo "No video-source release found; the app will use its video placeholder."
          fi

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/MarcoManual.app MarcoManual-macOS.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" MarcoManual-macOS.zip \
            --title "Marco Manual for Mac" \
            --notes "A tiny anniversary surprise for Marco."
